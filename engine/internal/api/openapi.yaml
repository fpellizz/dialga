openapi: 3.1.0
info:
  title: Dialga engine local API
  version: v1
  description: |
    The HTTP API the Dialga engine ("dialga serve") offers to the desktop shell.

    It listens on 127.0.0.1 only, on a random port. Every request needs the
    per-session bearer token the shell passes to the engine on stdin; the Host
    header must be a loopback name and a browser Origin, when present, must be
    in the allowlist. The configuration file is read on every request.

    SQL passwords never travel in requests or responses: the engine takes them
    from its own environment, as sql.password of each target says.

    Long operations stream Server-Sent Events over the response, read with
    fetch() (EventSource cannot send the Authorization header).
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
        description: Printed by the engine on stdout ({"event":"ready","port":N}).
security:
  - bearer: []
paths:
  /api/v1/health:
    get:
      summary: Engine status and version
      responses:
        "200":
          description: The engine answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/targets:
    get:
      summary: The configured targets
      description: |
        A missing configuration file is not an error (first run): targets is
        empty and configPath says where to create it. An invalid file comes
        back in the error field, with no targets.
      responses:
        "200":
          description: The targets, without password references.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/targets/{name}/checks:
    post:
      summary: Run the read-only checks of a target
      description: |
        Streams the checks as Server-Sent Events:
        "notice" (Notice) warnings before the steps, "step" (StepEvent) every
        time a step starts or ends, then one "done" (Done).
      parameters:
        - $ref: "#/components/parameters/TargetName"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: The target cannot be checked yet (connect.mode tunnel).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/tasks:
    get:
      summary: The native backup/restore tasks of a target, newest first
      description: Each call opens its own SQL session; RDS keeps 36 days of history.
      parameters:
        - $ref: "#/components/parameters/TargetName"
        - name: db
          in: query
          description: Only the tasks of this database.
          schema: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,99}$" }
        - name: limit
          in: query
          description: Maximum number of tasks.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400":
          description: Invalid db or limit.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: No SQL password in the engine environment, or connect.mode tunnel.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS or SQL Server did not answer (credentials, tunnel, login).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/uploads:
    post:
      summary: Plan or run the upload of local files to the bucket of a target
      description: |
        Multipart uploads with a CRC64NVME checksum S3 verifies; an object that
        exists is never replaced without overwrite.

        With apply false (the default) the answer is the plan and nothing
        changes. With apply true the plan runs and the answer streams
        Server-Sent Events: one "plan" (TransferPlan), "step" (StepEvent) when
        a file starts and ends, "progress" (TransferProgress) at most 4 times a
        second, then one "done" (TransferDone). Rejected files are in the plan
        with their reason and are not uploaded; the others are. Closing the
        stream cancels the upload, which is aborted in S3.
      parameters:
        - $ref: "#/components/parameters/TargetName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadsRequest" }
      responses:
        "200":
          description: The plan (apply false) or the event stream (apply true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPlan" }
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid body, path, key, prefix or concurrency.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: The plan asks to retype a text (protected target, replaced object) and confirm does not match.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS did not answer (credentials, account, bucket).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/downloads:
    post:
      summary: Plan or run the download of an object of the bucket of a target
      description: |
        Parallel ranged GETs into a temporary file next to dest, renamed once
        complete; the CRC checksum of the object is verified when it has one.
        A file that exists is never replaced without overwrite.

        apply and the events are as for uploads. A missing object, an existing
        file or too little free space is a rejection in the plan.
      parameters:
        - $ref: "#/components/parameters/TargetName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadRequest" }
      responses:
        "200":
          description: The plan (apply false) or the event stream (apply true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPlan" }
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid body, key, destination or concurrency.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: The plan asks to retype a text (protected target, replaced file) and confirm does not match.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS did not answer (credentials, account, bucket).
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The session token (32 characters at least) the shell generated.
  parameters:
    TargetName:
      name: name
      in: path
      required: true
      description: Target name from the configuration.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
  responses:
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        text/plain:
          schema: { type: string }
    Forbidden:
      description: Host not a loopback name, or Origin not allowed.
      content:
        text/plain:
          schema: { type: string }
    UnknownTarget:
      description: No target with that name in the configuration.
      content:
        text/plain:
          schema: { type: string }
    NoConfiguration:
      description: The configuration file is missing or invalid.
      content:
        text/plain:
          schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    TargetSummary:
      type: object
      description: A configured target as the GUI sees it; no password reference.
      required: [name, instance, region, profile, accountId, bucket, sqlUser, connectMode, protected]
      properties:
        name: { type: string }
        instance: { type: string, description: RDS DB instance identifier. }
        region: { type: string }
        profile: { type: string, description: AWS profile. }
        accountId: { type: string, pattern: "^[0-9]{12}$" }
        bucket: { type: string }
        sqlUser: { type: string }
        connectMode: { type: string, enum: [external, direct, tunnel] }
        localPort: { type: integer, description: Port of the open tunnel (external mode). }
        protected: { type: boolean, description: Every change asks to retype the target name. }
    TargetList:
      type: object
      required: [configPath, targets]
      properties:
        configPath: { type: string }
        error: { type: string, description: Why the configuration file is invalid. }
        targets:
          type: array
          items: { $ref: "#/components/schemas/TargetSummary" }
    StepEvent:
      type: object
      description: Data of a "step" event; also the events of an action plan.
      required: [step, label, status]
      properties:
        step: { type: string, description: "Stable step id: aws, instance, option, bucket, storage, tunnel, sql, tasks for a check." }
        label: { type: string, description: English label; the GUI translates known step ids. }
        status:
          type: string
          enum: [running, ok, warning, failed, skipped]
          description: warning is worth reading but does not fail the check.
        detail: { type: string }
    Notice:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Done:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: All steps passed. }
    Task:
      type: object
      description: |
        A row of msdb.dbo.rds_fn_task_status. Times are the server's wall
        clock without a zone, formatted as 2006-01-02T15:04:05.
      required: [id, type, database, percent, lifecycle]
      properties:
        id: { type: integer }
        type: { type: string, examples: [RESTORE_DB, BACKUP_DB] }
        database: { type: string }
        percent: { type: integer, minimum: 0, maximum: 100 }
        lifecycle: { type: string, enum: [CREATED, IN_PROGRESS, SUCCESS, ERROR, CANCEL_REQUESTED, CANCELLED] }
        info: { type: string, description: The RDS task log. }
        createdAt: { type: string }
        updatedAt: { type: string }
        s3Object: { type: string, description: ARN of the .bak. }
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    UploadsRequest:
      type: object
      description: Local files to upload; absolute paths on the machine of the engine.
      required: [files]
      properties:
        files: { type: array, minItems: 1, items: { type: string } }
        key: { type: string, description: S3 key of the object; one file only. }
        prefix: { type: string, description: 'Key prefix instead of the import prefix of the target ("" is the bucket root); not with key.' }
        overwrite: { type: boolean, description: Replace the objects that exist now. }
        concurrency: { type: integer, minimum: 1, maximum: 32, default: 4, description: Parts in flight. }
        apply: { type: boolean, description: Run the plan; false only answers it. }
        confirm: { type: string, description: The confirmation text of the plan, when it asks for one. }
    DownloadRequest:
      type: object
      required: [key, dest]
      properties:
        key: { type: string, description: 'A key, s3://<bucket of the target>/<key>, or a bare name under the export prefix.' }
        dest: { type: string, description: Absolute path of the local file, or of an existing folder. }
        overwrite: { type: boolean, description: Replace the file if it exists now. }
        concurrency: { type: integer, minimum: 1, maximum: 32, default: 4, description: Ranges in flight. }
        apply: { type: boolean, description: Run the plan; false only answers it. }
        confirm: { type: string, description: The confirmation text of the plan, when it asks for one. }
    TransferPlan:
      type: object
      description: A transfer plan; also the data of the "plan" event.
      required: [plan, confirmation, items, rejected]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        confirmation: { type: string, description: The text to retype in confirm; empty when none is needed. }
        items:
          type: array
          items: { $ref: "#/components/schemas/TransferItem" }
        rejected:
          type: array
          description: The files that cannot be transferred, with the reason.
          items: { $ref: "#/components/schemas/Rejection" }
        warnings: { type: array, items: { type: string } }
    Plan:
      type: object
      description: An operation on a target, as its preview shows it.
      required: [operation, target, instance, protected, actions]
      properties:
        operation: { type: string, examples: [upload, download] }
        target: { type: string }
        instance: { type: string }
        protected: { type: boolean, description: Running it asks to retype the target name. }
        subject: { type: string, description: What a destructive plan removes or replaces; retyped to confirm. }
        actions:
          type: array
          items: { $ref: "#/components/schemas/Action" }
    Action:
      type: object
      required: [id, title, kind, risk, statement]
      properties:
        id: { type: string, description: The step id of its events. }
        title: { type: string }
        kind: { type: string, enum: [sql, aws] }
        risk: { type: string, enum: [change, destructive] }
        statement: { type: string, description: The T-SQL or the AWS call the action runs. }
    TransferItem:
      type: object
      required: [step, path, bucket, key, size, partSize, parts, replaces]
      properties:
        step: { type: string, description: Id of its plan action. }
        path: { type: string }
        bucket: { type: string }
        key: { type: string }
        size: { type: integer }
        partSize: { type: integer, description: Bytes per part (upload) or range (download). }
        parts: { type: integer }
        checksum: { type: string, examples: [CRC64NVME], description: Algorithm verified at the end; absent when the object has none that can be checked. }
        replaces: { type: boolean, description: An existing object or file is replaced. }
    Rejection:
      type: object
      required: [reason]
      properties:
        path: { type: string }
        key: { type: string }
        reason: { type: string }
    TransferProgress:
      type: object
      description: Data of a "progress" event.
      required: [path, key, done, total, parts, partsTotal, bytesPerSecond]
      properties:
        step: { type: string, description: Id of the plan action. }
        path: { type: string }
        key: { type: string }
        done: { type: integer, description: Bytes transferred; never goes back. }
        total: { type: integer }
        parts: { type: integer, description: Parts or ranges completed. }
        partsTotal: { type: integer }
        bytesPerSecond: { type: number, description: Over the last 10 seconds; the average in the last event. }
        etaSeconds: { type: integer, description: Time left; absent when unknown or done. }
    TransferResult:
      type: object
      required: [path, bucket, key, size, verified, seconds, bytesPerSecond]
      properties:
        path: { type: string }
        bucket: { type: string }
        key: { type: string }
        size: { type: integer }
        checksumAlgorithm: { type: string }
        checksum: { type: string, description: Base64, as S3 shows it. }
        verified: { type: boolean, description: The checksum computed here matches the one S3 keeps. }
        note: { type: string, description: Why the checksum was not verified. }
        seconds: { type: number }
        bytesPerSecond: { type: number }
    TransferDone:
      type: object
      description: Data of the final "done" event of a transfer.
      required: [ok, results]
      properties:
        ok: { type: boolean, description: Every file of the plan was transferred and none was rejected. }
        error: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/TransferResult" }

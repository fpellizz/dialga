openapi: 3.1.0
info:
  title: Dialga engine local API
  version: v1
  description: |
    The HTTP API the Dialga engine ("dialga serve") offers to the desktop shell.

    It listens on 127.0.0.1 only, on a random port. Every request needs the
    per-session bearer token the shell passes to the engine on stdin; the Host
    header must be a loopback name and a browser Origin, when present, must be
    in the allowlist. The configuration file is read on every request.

    SQL passwords never travel in requests or responses: the engine takes them
    from its own environment, as sql.password of each target says.

    Long operations stream Server-Sent Events over the response, read with
    fetch() (EventSource cannot send the Authorization header).
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "0"
        description: Printed by the engine on stdout ({"event":"ready","port":N}).
security:
  - bearer: []
paths:
  /api/v1/health:
    get:
      summary: Engine status and version
      responses:
        "200":
          description: The engine answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/targets:
    get:
      summary: The configured targets
      description: |
        A missing configuration file is not an error (first run): targets is
        empty and configPath says where to create it. An invalid file comes
        back in the error field, with no targets.
      responses:
        "200":
          description: The targets, without password references.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/targets/{name}/checks:
    post:
      summary: Run the read-only checks of a target
      description: |
        Streams the checks as Server-Sent Events:
        "notice" (Notice) warnings before the steps, "step" (StepEvent) every
        time a step starts or ends, then one "done" (Done).
      parameters:
        - $ref: "#/components/parameters/TargetName"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: The target cannot be checked (invalid connection values).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/tasks:
    get:
      summary: The native backup/restore tasks of a target, newest first
      description: |
        Each call opens its own SQL session (with connect.mode tunnel, its own
        SSM tunnel too); RDS keeps 36 days of history.
      parameters:
        - $ref: "#/components/parameters/TargetName"
        - name: db
          in: query
          description: Only the tasks of this database.
          schema: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,99}$" }
        - name: limit
          in: query
          description: Maximum number of tasks.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400":
          description: Invalid db or limit.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: No SQL password in the engine environment.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS or SQL Server did not answer (credentials, tunnel, login).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/databases:
    get:
      summary: The user databases of a target, by name
      description: |
        sys.databases without the system databases and rdsadmin, with the size
        of the data and log files from sys.master_files. Each call opens its
        own SQL session.
      parameters:
        - $ref: "#/components/parameters/TargetName"
      responses:
        "200":
          description: The databases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseList" }
  /api/v1/inspect:
    post:
      summary: Read .bak files locally and judge them against a target
      description: |
        Starts a throwaway SQL Server in a local container (podman, or docker)
        with the files mounted read-only, runs RESTORE LABELONLY, HEADERONLY and
        FILELISTONLY, then removes the container. Several files are several
        backups, or the stripes of one: they are grouped by media set. With a
        target, every backup is judged against its engine and the restored
        files against its free storage (AWS is only read; no SQL password).

        Streams Server-Sent Events: "step" (StepEvent) every time a step starts
        or ends (target, runtime, image, container, ready, media, header, files,
        verdict, space, cleanup; no target, verdict and space without a
        target), then "result" (InspectResult), or "notice" (Notice) with the
        error when the inspection stops, then one "done" (Done: ok when the
        outcome is restorable, or read without a target).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InspectRequest" }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid body, a path not absolute, a file missing or not readable, an invalid image.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: No SQL password in the engine environment.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS or SQL Server did not answer (credentials, tunnel, login).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/overview:
    get:
      summary: The state of a target's RDS instance
      description: |
        The instance as AWS describes it (status, engine, class, storage, free
        space from CloudWatch) and, when a SQL session opens, its user
        databases and unfinished native tasks. The AWS part needs no SQL
        password: without one sql is "skipped",
        and a SQL failure comes back as sql "failed", both with sqlDetail.
      parameters:
        - $ref: "#/components/parameters/TargetName"
      responses:
        "200":
          description: The overview, possibly without the SQL part.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "502":
          description: AWS did not answer (credentials, account, instance).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/plans/{operation}:
    post:
      summary: Preview a native operation (dry run)
      description: |
        Runs the read-only pre-flight checks of the operation and answers its
        plan with the exact T-SQL it would run. Nothing is changed: a failed
        check is in the answer (ready false), not an error. Each call opens
        its own SQL session.
      parameters:
        - $ref: "#/components/parameters/TargetName"
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [restore, export, finish, cancel, drop] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: The plan, its checks and the text to retype to execute it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPreview" }
        "400":
          description: Invalid body or parameters (database name, S3 key, task id).
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown target or operation.
          content:
            text/plain:
              schema: { type: string }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: No SQL password in the engine environment.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS or SQL Server did not answer (credentials, tunnel, login).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/plans/{operation}/execute:
    post:
      summary: Execute a native operation
      description: |
        Builds the plan again, refuses it when a pre-flight check fails, when
        digest is set and differs from the plan (it changed since the
        preview) or when confirm differs from the confirmation; then streams
        Server-Sent Events: "notice" (Notice) for the pre-flight warnings,
        "step" (StepEvent) when an action, or the wait for the task, starts
        or ends, "task" (Task) for every change of the followed task, then
        one "done" (PlanDone). Closing the stream stops the wait, never the
        task on the instance.
      parameters:
        - $ref: "#/components/parameters/TargetName"
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [restore, export, finish, cancel, drop] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteRequest" }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid body or parameters (database name, S3 key, task id).
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown target or operation.
          content:
            text/plain:
              schema: { type: string }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "412":
          description: A pre-flight check failed, or the plan changed since the preview (digest). Nothing was changed.
          content:
            text/plain:
              schema: { type: string }
        "422":
          description: Confirmation missing or different, or no SQL password in the engine environment.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS or SQL Server did not answer (credentials, tunnel, login).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/targets/{name}/databases/{db}/report:
    get:
      summary: Post-restore report of a database (read-only)
      description: Properties, files, login access, orphaned SQL users, Windows principals and objects by type.
      parameters:
        - $ref: "#/components/parameters/TargetName"
        - name: db
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,99}$" }
      responses:
        "200":
          description: The report; ok is false when the database is not online or the login cannot enter it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseReport" }
        "400":
          description: Invalid database name.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown target, or no such database on the instance.
          content:
            text/plain:
              schema: { type: string }
        "409": { $ref: "#/components/responses/NoConfiguration" }
        "422":
          description: No SQL password in the engine environment.
          content:
            text/plain:
              schema: { type: string }
        "502":
          description: AWS or SQL Server did not answer (credentials, tunnel, login).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/prerequisites:
    get:
      summary: The programs Dialga runs, found or not
      description: |
        session-manager-plugin (SSM tunnels; also looked up where the installers
        put it) and the container runtime (podman, otherwise docker, or the one
        DIALGA_CONTAINER_RUNTIME names; inspect). Each item carries the install
        command for Fedora and Debian, worth showing when it is missing or
        outdated.
      responses:
        "200":
          description: The prerequisites.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrerequisiteList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/discovery/profiles:
    get:
      summary: The AWS profiles of this computer
      description: |
        Names from the shared config and credentials files (AWS_CONFIG_FILE,
        AWS_SHARED_CREDENTIALS_FILE or ~/.aws), with the region of the config
        file. Of the credentials file only the section headers are read.
        Missing files are an empty list.
      responses:
        "200":
          description: The profiles, sorted by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: A shared file exists but cannot be read.
          content:
            text/plain:
              schema: { type: string }
  /api/v1/discovery/instances:
    get:
      summary: The RDS SQL Server instances a profile sees in a region
      description: |
        Read-only: sts:GetCallerIdentity (the account, to pre-fill accountId),
        rds:DescribeDBInstances and rds:DescribeOptionGroups (whether each
        option group has SQLSERVER_BACKUP_RESTORE).
      parameters:
        - name: profile
          in: query
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._@+-]{1,64}$" }
        - name: region
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]$" }
      responses:
        "200":
          description: The instances, sorted by identifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceDiscovery" }
        "400":
          description: Invalid profile or region.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: AWS did not answer (credentials, expired SSO session, permissions).
          content:
            text/plain:
              schema: { type: string }
  /api/v1/config/targets:
    post:
      summary: Add a target to the configuration file, or replace it
      description: |
        Validated with the rules of the file, then written atomically (0600,
        the previous file kept as .bak; comments are not kept). The file on
        disk must parse: an invalid one is never overwritten. The body never
        holds a password, only where to find it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetInput" }
      responses:
        "200":
          description: The target replaced an existing one (replace).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetSummary" }
        "201":
          description: The target was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetSummary" }
        "400":
          description: Invalid body or target; the message says which fields.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A target has that name (and replace is not set), or the file on disk does not parse.
          content:
            text/plain:
              schema: { type: string }
  /api/v1/config/targets/{name}:
    delete:
      summary: Remove a target from the configuration file
      description: |
        Removing the last target removes the file (the previous one is kept
        as .bak): the next start is a first run.
      parameters:
        - $ref: "#/components/parameters/TargetName"
        - name: confirm
          in: query
          required: true
          description: The target name again.
          schema: { type: string }
      responses:
        "204":
          description: The target was removed.
        "400":
          description: confirm does not repeat the name.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownTarget" }
        "409":
          description: The file on disk does not parse.
          content:
            text/plain:
              schema: { type: string }
  /api/v1/jobs:
    get:
      summary: The import/export jobs, newest first
      description: |
        Jobs kept by the engine: the running ones and the history (the last
        200 ended jobs, 30 days at most). Jobs that were running when the
        engine stopped are interrupted.
      responses:
        "200":
          description: The jobs, without steps and events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/jobs/{id}:
    get:
      summary: One job, with its databases, steps and event log
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownJob" }
  /api/v1/jobs/{id}/events:
    get:
      summary: The events of a job, logged then live
      description: |
        Server-Sent Events: the logged events after Last-Event-ID (or
        ?after=), then the live ones (also upload.progress and the
        task.status percentages, which the log does not keep). Each event
        has id = its seq, event = its type and data = JobEvent. The stream
        closes after the final job.succeeded, job.failed, job.cancelled or
        job.interrupted event; if it closes without one (the client fell
        behind, the engine stops), reconnect with Last-Event-ID. Comment
        lines keep an idle stream alive.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: Last-Event-ID
          in: header
          description: Seq of the last event received; wins over ?after=.
          schema: { type: integer, minimum: 0 }
        - name: after
          in: query
          description: Seq of the last event received.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Last-Event-ID or after is not a seq.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownJob" }
  /api/v1/jobs/{id}/cancel:
    post:
      summary: Cancel a job
      description: |
        Queued and waiting steps do not start, running steps stop. A native
        RDS task already running on the instance is not stopped: its
        database gets taskLeftRunning and a warning in the log. The job ends
        with a job.cancelled event once its steps have returned.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: Cancel requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UnknownJob" }
        "409":
          description: The job already ended.
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The session token (32 characters at least) the shell generated.
  parameters:
    JobID:
      name: id
      in: path
      required: true
      description: Job id.
      schema: { type: string, pattern: "^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$" }
    TargetName:
      name: name
      in: path
      required: true
      description: Target name from the configuration.
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
  responses:
    UnknownJob:
      description: No job with that id (or removed by the retention).
      content:
        text/plain:
          schema: { type: string }
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        text/plain:
          schema: { type: string }
    Forbidden:
      description: Host not a loopback name, or Origin not allowed.
      content:
        text/plain:
          schema: { type: string }
    UnknownTarget:
      description: No target with that name in the configuration.
      content:
        text/plain:
          schema: { type: string }
    NoConfiguration:
      description: The configuration file is missing or invalid.
      content:
        text/plain:
          schema: { type: string }
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    TargetSummary:
      type: object
      description: A configured target as the GUI sees it; no password reference.
      required: [name, instance, region, profile, accountId, bucket, sqlUser, connectMode, protected]
      properties:
        name: { type: string }
        instance: { type: string, description: RDS DB instance identifier. }
        region: { type: string }
        profile: { type: string, description: AWS profile. }
        accountId: { type: string, pattern: "^[0-9]{12}$" }
        bucket: { type: string }
        sqlUser: { type: string }
        connectMode: { type: string, enum: [external, direct, tunnel] }
        localPort: { type: integer, description: "Port of the open tunnel (external mode), or of the integrated one (tunnel mode; absent: a free port)." }
        protected: { type: boolean, description: Every change asks to retype the target name. }
    TargetList:
      type: object
      required: [configPath, targets]
      properties:
        configPath: { type: string }
        error: { type: string, description: Why the configuration file is invalid. }
        targets:
          type: array
          items: { $ref: "#/components/schemas/TargetSummary" }
    StepEvent:
      type: object
      description: Data of a "step" event; also the events of an action plan.
      required: [step, label, status]
      properties:
        step: { type: string, description: "Stable step id: aws, instance, option, bucket, storage, tunnel, sql, tasks for a check." }
        label: { type: string, description: English label; the GUI translates known step ids. }
        status:
          type: string
          enum: [running, ok, warning, failed, skipped]
          description: warning is worth reading but does not fail the check.
        detail: { type: string }
    Notice:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Done:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: All steps passed. }
    Task:
      type: object
      description: |
        A row of msdb.dbo.rds_fn_task_status. Times are the server's wall
        clock without a zone, formatted as 2006-01-02T15:04:05.
      required: [id, type, database, percent, lifecycle]
      properties:
        id: { type: integer }
        type: { type: string, examples: [RESTORE_DB, BACKUP_DB] }
        database: { type: string }
        percent: { type: integer, minimum: 0, maximum: 100 }
        lifecycle: { type: string, enum: [CREATED, IN_PROGRESS, SUCCESS, ERROR, CANCEL_REQUESTED, CANCELLED] }
        info: { type: string, description: The RDS task log. }
        createdAt: { type: string }
        updatedAt: { type: string }
        s3Object: { type: string, description: ARN of the .bak. }
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    Database:
      type: object
      description: |
        A user database (sys.databases). Sizes are in MiB, from
        sys.master_files: 0 when the login cannot read it.
      required: [name, state, recovery, compatibility, userAccess, readOnly, createdAt, dataMB, logMB]
      properties:
        name: { type: string }
        state:
          type: string
          examples: [ONLINE, RESTORING, RECOVERING, RECOVERY_PENDING, SUSPECT, EMERGENCY, OFFLINE]
        recovery: { type: string, examples: [FULL, SIMPLE, BULK_LOGGED] }
        compatibility: { type: integer, examples: [140] }
        collation: { type: string, description: Absent while the database is offline. }
        owner: { type: string, description: Login of the owner SID; absent when no login has it. }
        userAccess: { type: string, examples: [MULTI_USER, SINGLE_USER, RESTRICTED_USER] }
        readOnly: { type: boolean }
        createdAt: { type: string, description: "Server wall clock without a zone: 2006-01-02T15:04:05." }
        dataMB: { type: number, description: Data files (rows, filestream, full-text). }
        logMB: { type: number, description: Log files. }
    DatabaseList:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items: { $ref: "#/components/schemas/Database" }
    Overview:
      type: object
      description: The RDS instance of a target and, when a SQL session opens, its usage.
      required: [target, instance, status, engine, engineVersion, class, allocatedGiB, sql]
      properties:
        target: { type: string }
        instance: { type: string, description: RDS DB instance identifier. }
        status: { type: string, examples: [available, modifying, stopped] }
        engine: { type: string, examples: [sqlserver-se] }
        engineVersion: { type: string, examples: [14.00.3465.1.v1] }
        class: { type: string, examples: [db.m6i.large] }
        allocatedGiB: { type: integer }
        maxAllocatedGiB: { type: integer, description: Storage autoscaling limit; absent without autoscaling. }
        freeBytes: { type: integer, description: Free storage from CloudWatch (lowest of the last 20 minutes). }
        freeError: { type: string, description: Why freeBytes is missing. }
        sql:
          type: string
          enum: [ok, skipped, failed]
          description: skipped without a SQL password in the engine environment.
        sqlDetail: { type: string, description: Why the SQL part is skipped or failed. }
        userDatabases: { type: integer, description: Present when sql is ok. }
        activeTasks: { type: integer, description: Native tasks queued, running or being cancelled; present when sql is ok. }
    InspectRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 64
          description: Absolute paths of local .bak files (backups, or the stripes of one).
          items: { type: string }
        target: { type: string, description: Target to judge the backups against; omitted reads the headers only. }
        image: { type: string, description: "SQL Server image that reads the backups (default mcr.microsoft.com/mssql/server:2022-latest). Never pulled implicitly." }
    InspectResult:
      type: object
      description: Data of the "result" event of an inspection.
      required: [outcome, runtime, image, server, backups, requiredBytes]
      properties:
        outcome:
          type: string
          enum: [restorable, not-restorable, read, error]
          description: error when some file could not be read; read without a target.
        runtime: { type: string, examples: [podman 5.8.4] }
        image: { type: string }
        server: { type: string, description: Version of the throwaway SQL Server that read the files. }
        target: { $ref: "#/components/schemas/InspectTarget" }
        backups:
          type: array
          description: In the order of their first file.
          items: { $ref: "#/components/schemas/InspectBackup" }
        requiredBytes: { type: integer, description: What all the restored databases take (sum of their files, not of the .bak files). }
        space: { $ref: "#/components/schemas/InspectFinding" }
    InspectTarget:
      type: object
      required: [name, instance, engine, engineVersion, major]
      properties:
        name: { type: string }
        instance: { type: string }
        engine: { type: string, examples: [sqlserver-se] }
        engineVersion: { type: string, examples: [14.00.3540.1.v1] }
        major: { type: integer, description: "SQL Server major version: 14 = SQL Server 2017." }
        freeBytes: { type: integer, description: Free storage from CloudWatch; omitted when unknown. }
    InspectBackup:
      type: object
      description: One backup, a .bak file or the stripes of one backup.
      required: [files, outcome, requiredBytes, backupSets]
      properties:
        files:
          type: array
          description: The paths, in stripe order.
          items: { type: string }
        outcome: { type: string, enum: [restorable, not-restorable, read, error] }
        error: { type: string, description: Why the backup could not be read. }
        header: { $ref: "#/components/schemas/InspectHeader" }
        databaseFiles:
          type: array
          items: { $ref: "#/components/schemas/InspectFile" }
        requiredBytes: { type: integer, description: Sum of the database files. }
        backupSets: { type: integer, description: Backup sets in the media; RDS restores the first. }
        findings:
          type: array
          description: The rules of the verdict (with a target only).
          items: { $ref: "#/components/schemas/InspectFinding" }
        remedy: { type: string, description: What to do when the backup is not restorable or unreadable. }
    InspectHeader:
      type: object
      description: The first backup set of RESTORE HEADERONLY.
      required: [databaseName, serverName, backupType, version, major, product, compatibilityLevel, collation,
        recoveryModel, compressed, checksums, copyOnly, backupSize, compressedSize, startedAt, finishedAt]
      properties:
        databaseName: { type: string }
        serverName: { type: string }
        backupType:
          type: string
          enum: [full, differential, log, file, file differential, partial, partial differential]
        version: { type: string, description: Source SQL Server version, major.minor.build. }
        major: { type: integer }
        product: { type: string, examples: [SQL Server 2017] }
        compatibilityLevel: { type: integer }
        collation: { type: string }
        recoveryModel: { type: string, enum: [FULL, BULK-LOGGED, SIMPLE] }
        compressed: { type: boolean }
        checksums: { type: boolean }
        copyOnly: { type: boolean }
        encryption: { type: string, description: Backup encryption algorithm; omitted when the backup is not encrypted. }
        backupSize: { type: integer }
        compressedSize: { type: integer }
        startedAt: { type: string, description: "Source server's wall clock, without a zone: 2006-01-02T15:04:05." }
        finishedAt: { type: string }
    InspectFile:
      type: object
      description: A database file in the backup (RESTORE FILELISTONLY).
      required: [logicalName, physicalName, type, sizeBytes, tde]
      properties:
        logicalName: { type: string }
        physicalName: { type: string }
        type: { type: string, enum: [D, L, S, F], description: "D data, L log, S FILESTREAM or In-Memory OLTP, F full-text catalog." }
        fileGroup: { type: string }
        sizeBytes: { type: integer }
        tde: { type: boolean, description: Encrypted with Transparent Data Encryption. }
    InspectFinding:
      type: object
      required: [check, status, message]
      properties:
        check: { type: string, enum: [version, type, encryption, tde, filestream, sets, space] }
        status:
          type: string
          enum: [ok, warning, failed]
          description: warning is worth reading but does not block the restore.
        message: { type: string }
    PlanAction:
      type: object
      description: One action of a plan, with the exact statement it runs.
      required: [id, title, kind, risk, statement]
      properties:
        id: { type: string, description: "Stable action id: restore, export, finish, cancel, drop." }
        title: { type: string }
        kind: { type: string, enum: [sql, aws] }
        risk: { type: string, enum: [change, destructive] }
        statement: { type: string, description: The T-SQL (or AWS call) as it runs. }
    Plan:
      type: object
      description: An operation on a target, ready to preview or execute.
      required: [operation, target, instance, protected, actions]
      properties:
        operation: { type: string }
        target: { type: string }
        instance: { type: string }
        protected: { type: boolean, description: The target asks to retype its name before any change. }
        subject: { type: string, description: What a destructive plan removes (the database name). }
        actions:
          type: array
          items: { $ref: "#/components/schemas/PlanAction" }
    PlanRequest:
      type: object
      description: |
        The parameters of an operation: database (restore, export, finish,
        drop), key (restore; optional for export, default
        <export prefix>/<db>_<YYYYMMDD-HHMMSS>.bak in UTC), differential and
        noRecovery (restore), taskId (cancel). A bare file name goes under the
        target prefix, s3://<bucket>/<key> must name the target bucket.
      properties:
        database: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,99}$" }
        key: { type: string }
        differential: { type: boolean }
        noRecovery: { type: boolean }
        taskId: { type: integer, minimum: 1 }
    ExecuteRequest:
      type: object
      description: The parameters of the preview (send back its request), plus how to run it.
      properties:
        database: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]{0,99}$" }
        key: { type: string }
        differential: { type: boolean }
        noRecovery: { type: boolean }
        taskId: { type: integer, minimum: 1 }
        confirm: { type: string, description: The confirmation of the preview, retyped by the user. }
        digest: { type: string, description: The digest of the preview; when set, a different plan is refused (412). }
        noWait: { type: boolean, description: Return once the native task is started instead of following it. }
    PlanPreview:
      type: object
      required: [plan, checks, ready, digest, preview, request]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        checks:
          type: array
          description: The read-only pre-flight checks (StepEvent, status ok, warning or failed).
          items: { $ref: "#/components/schemas/StepEvent" }
        ready: { type: boolean, description: No check failed; the plan can be executed. }
        confirmation: { type: string, description: The text the user must retype to execute; absent when none. }
        digest: { type: string, description: Identifies the plan (same statements on the same target). }
        preview: { type: string, description: The dry-run text, as the CLI prints it. }
        request: { $ref: "#/components/schemas/PlanRequest" }
    PlanDone:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: Every action ran and the followed task ended in SUCCESS. }
        error: { type: string }
        task: { $ref: "#/components/schemas/Task" }
    DatabaseInfo:
      type: object
      required: [name, state, recoveryModel, compatibilityLevel, userAccess, readOnly]
      properties:
        name: { type: string }
        state: { type: string, examples: [ONLINE, RESTORING] }
        recoveryModel: { type: string }
        compatibilityLevel: { type: integer }
        collation: { type: string, description: Absent while the database is not online. }
        owner: { type: string }
        userAccess: { type: string }
        readOnly: { type: boolean }
    DatabaseFile:
      type: object
      required: [type, name, sizeMB, physicalName]
      properties:
        type: { type: string, examples: [ROWS, LOG] }
        name: { type: string }
        sizeMB: { type: number }
        maxSizeMB: { type: number, description: Absent when the file grows without a limit. }
        physicalName: { type: string }
    ObjectCount:
      type: object
      required: [type, count]
      properties:
        type: { type: string, examples: [USER_TABLE, VIEW] }
        count: { type: integer }
    DatabaseReport:
      type: object
      description: The post-restore report of a database (mssql-import.sh post).
      required: [target, instance, ok, findings, database, files, access, orphanUsers, windowsPrincipals, objects]
      properties:
        target: { type: string }
        instance: { type: string }
        ok: { type: boolean, description: No finding failed (warnings allowed). }
        findings:
          type: array
          description: "Verdicts (StepEvent): database, access, orphans, windows."
          items: { $ref: "#/components/schemas/StepEvent" }
        database: { $ref: "#/components/schemas/DatabaseInfo" }
        files:
          type: array
          items: { $ref: "#/components/schemas/DatabaseFile" }
        access: { type: boolean, description: The SQL login can enter the database; without it users and objects are not read. }
        orphanUsers:
          type: array
          description: SQL users without a login on the instance.
          items: { type: string }
        windowsPrincipals: { type: integer, description: Windows users and groups, unusable on RDS without Active Directory. }
        objects:
          type: array
          items: { $ref: "#/components/schemas/ObjectCount" }
    InstallHint:
      type: object
      required: [distro, command]
      properties:
        distro: { type: string, enum: [fedora, debian], description: debian also covers Ubuntu. }
        command: { type: string }
    Prerequisite:
      type: object
      required: [id, program, found, purpose, install]
      properties:
        id: { type: string, enum: [session-manager-plugin, container-runtime] }
        program: { type: string, description: The program found, or the one to install when none is. }
        found: { type: boolean }
        path: { type: string }
        version: { type: string, description: Empty when the program does not tell it. }
        outdated:
          type: boolean
          description: Found but too old (a Session Manager plugin not newer than 1.2.497.0 cannot run the integrated tunnel).
        purpose: { type: string, description: What needs it (English; the GUI translates known ids). }
        install:
          type: array
          items: { $ref: "#/components/schemas/InstallHint" }
    PrerequisiteList:
      type: object
      required: [prerequisites]
      properties:
        prerequisites:
          type: array
          items: { $ref: "#/components/schemas/Prerequisite" }
    AWSProfile:
      type: object
      required: [name]
      properties:
        name: { type: string }
        region: { type: string, description: The region of the profile in the config file. }
    ProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/AWSProfile" }
    DiscoveredInstance:
      type: object
      required: [identifier, engine, engineVersion, class, status, backupRestore]
      properties:
        identifier: { type: string, description: RDS DB instance identifier. }
        endpoint: { type: string }
        port: { type: integer }
        engine: { type: string, examples: [sqlserver-se, sqlserver-ee, sqlserver-ex, sqlserver-web] }
        engineVersion: { type: string }
        class: { type: string, examples: [db.m6i.large] }
        status: { type: string, examples: [available] }
        masterUser: { type: string, description: The default SQL login of a new target. }
        optionGroup: { type: string }
        backupRestore: { type: boolean, description: The option group has SQLSERVER_BACKUP_RESTORE. }
    InstanceDiscovery:
      type: object
      required: [profile, region, accountId, instances]
      properties:
        profile: { type: string }
        region: { type: string }
        accountId: { type: string, pattern: "^[0-9]{12}$", description: The account the profile points to. }
        instances:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredInstance" }
    TargetInput:
      type: object
      description: A target as the GUI form fills it. No password, only where to find it.
      required: [name, accountId, region, profile, instance, bucket, sqlUser, passwordSource, connectMode, protected]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        accountId: { type: string, pattern: "^[0-9]{12}$" }
        region: { type: string }
        profile: { type: string }
        instance: { type: string }
        bucket: { type: string }
        sqlUser: { type: string }
        passwordSource:
          type: string
          description: prompt (DIALGA_SQL_PASSWORD in the engine environment, or asked on the terminal) or env:VAR.
          examples: [prompt, "env:MSSQL_PASSWORD"]
        connectMode: { type: string, enum: [external, direct, tunnel] }
        localPort: { type: integer, minimum: 1, maximum: 65535, description: Required with external. }
        protected: { type: boolean }
        replace:
          type: boolean
          description: Replace the target with the same name; prefixes, max_tasks and bridge_tag keep their values.
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobSummary" }
    JobSummary:
      type: object
      description: A job in a list.
      required: [id, kind, target, instance, state, createdAt, updatedAt, databases, succeeded, failed]
      properties:
        id: { type: string }
        kind: { type: string, examples: [import, export] }
        target: { type: string }
        instance: { type: string, description: RDS DB instance identifier. }
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, interrupted]
          description: interrupted = the engine stopped (app closed, crash) while it ran.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        cancelRequested: { type: boolean }
        databases: { type: array, items: { type: string } }
        succeeded: { type: integer, description: Databases done. }
        failed: { type: integer, description: Databases failed. }
    Job:
      type: object
      required: [id, kind, target, instance, maxTasks, state, createdAt, updatedAt, items, events]
      properties:
        id: { type: string }
        kind: { type: string, examples: [import, export] }
        target: { type: string }
        instance: { type: string, description: RDS DB instance identifier. }
        maxTasks: { type: integer, minimum: 1, maximum: 2, description: Native tasks at once on the instance. }
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, interrupted]
          description: interrupted = the engine stopped (app closed, crash) while it ran.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        cancelRequested: { type: boolean }
        items:
          type: array
          description: One per database, in the order of the job.
          items: { $ref: "#/components/schemas/JobItem" }
        events:
          type: array
          description: The log; upload.progress and the task percentages are live only.
          items: { $ref: "#/components/schemas/JobEvent" }
    JobItem:
      type: object
      description: One database of a job.
      required: [name, state, percent, steps]
      properties:
        name: { type: string }
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled, interrupted]
          description: interrupted = the engine stopped (app closed, crash) while it ran.
        step: { type: string, description: The current step, or the last one reached. }
        percent: { type: integer, minimum: 0, maximum: 100, description: Progress of the current step. }
        steps:
          type: array
          items: { $ref: "#/components/schemas/JobStep" }
        transfer: { $ref: "#/components/schemas/TransferProgress" }
        task: { $ref: "#/components/schemas/TaskProgress" }
        taskIds:
          type: array
          description: Every native task of the database, oldest first.
          items: { type: integer }
        taskLeftRunning:
          type: boolean
          description: The database stopped (cancel, interrupt) while its native task still ran on the instance.
        upload: { $ref: "#/components/schemas/MultipartUpload" }
        error: { type: string }
        result: { type: string }
    JobStep:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string, examples: [upload, restore, wait, post] }
        title: { type: string, description: English label; the GUI translates known step ids. }
        resource:
          type: string
          description: What the scheduler limits; absent for local work.
          examples: [transfer, rds-task]
        status:
          type: string
          enum: [pending, waiting, running, succeeded, failed, skipped, cancelled, interrupted]
          description: waiting = next, waiting for a free slot of its resource; skipped = an earlier step failed.
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        detail: { type: string, description: Result line, or the error of a failed step. }
        kind: { type: string, description: "The factory that rebuilds the step on a resume; absent: the step cannot be resumed." }
        params: { description: "What that factory gets back on a resume (any JSON). Never secrets." }
        taskId: { type: integer, description: The native task the step reported. }
    JobEvent:
      type: object
      description: One change of a job; seq grows by one per event of the job.
      required: [seq, time, type]
      properties:
        seq: { type: integer }
        time: { type: string, format: date-time }
        type:
          type: string
          examples: [job.queued, job.started, job.cancelling, job.succeeded, job.failed, job.cancelled, job.interrupted, job.resumed,
            step.waiting, step.started, step.succeeded, step.failed, step.skipped, step.cancelled, step.interrupted,
            upload.progress, task.status, log]
        item: { type: string, description: The database. }
        step: { type: string }
        message: { type: string }
        level: { type: string, enum: [info, warn, error], description: Set on log events. }
        transfer: { $ref: "#/components/schemas/TransferProgress" }
        task: { $ref: "#/components/schemas/TaskProgress" }
    TransferProgress:
      type: object
      description: An S3 upload or download; speed and ETA computed by the engine.
      required: [direction, bytes, total, bytesPerSecond]
      properties:
        direction: { type: string, enum: [upload, download] }
        bytes: { type: integer }
        total: { type: integer }
        bytesPerSecond: { type: integer }
        etaSeconds: { type: integer, description: Absent while the speed is not known. }
    TaskProgress:
      type: object
      description: The last known state of a native RDS task.
      required: [id, lifecycle, percent]
      properties:
        id: { type: integer }
        type: { type: string, examples: [RESTORE_DB, BACKUP_DB] }
        lifecycle: { type: string, enum: [CREATED, IN_PROGRESS, SUCCESS, ERROR, CANCEL_REQUESTED, CANCELLED] }
        percent: { type: integer, minimum: 0, maximum: 100 }
    MultipartUpload:
      type: object
      description: What resuming the upload of the database needs; on resume, ListParts on S3 is the truth.
      required: [bucket, key, uploadId, size, partSize, partsDone]
      properties:
        bucket: { type: string }
        key: { type: string }
        uploadId: { type: string }
        size: { type: integer }
        partSize: { type: integer }
        partsDone: { type: array, items: { type: integer } }

[package]
name = "dialga-desktop"
version = "0.7.2"
description = "Dialga desktop shell: Tauri window around the Go engine sidecar"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

# The program name, so that the Wayland app_id matches Dialga.desktop.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

[profile.release]
codegen-units = 1
lto = true
strip = true
